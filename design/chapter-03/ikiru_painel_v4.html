/* Disponibilidade ao vivo — horãrio oficial dos estúdios (São Paulo) */
.room-now{min-height:181px;gap:0;position:relative}
.room-now.is-available{border-color:#315646;background:linear-gradient(130deg,#16231d,#121315 72%)}
.room-now.is-occupied{border-color:#633739;background:linear-gradient(130deg,#2a181b,#141216 72%)}
.room-now .room-bullet{background:#8fd6b1;box-shadow:0 0 0 4px #8fd6b11c}
.room-now.is-occupied .room-bullet{background:#ff797d;box-shadow:0 0 0 4px #ef404322}
.room-now .room-status{font-size:clamp(19px,2vw,27px);font-weight:760;letter-spacing:-.035em;margin-top:14px;line-height:1.2}
.room-now.is-available .room-status{color:#abebc9}
.room-now.is-occupied .room-status{color:#ff9397}
.room-now .room-countdown{font-size:14px;font-weight:670;color:#f0e9ec;margin-top:6px;min-height:20px}
.room-now .room-detail{font-size:11px;line-height:1.5;align-items:center;margin-top:auto;padding-top:12px;min-height:45px}
.room-now .room-detail>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-now .room-usage{color:#89878f;font-size:10px;margin-top:6px}
.studio-current{display:flex;align-items:flex-start;gap:10px;background:#18302447;border:1px solid #375947;border-radius:10px;padding:12px 13px;margin-top:15px}
.studio-current.is-occupied{background:#3b222447;border-color:#794044}
.studio-current .indicator{width:9px;height:9px;background:#8fd6b1;border-radius:50%;flex:none;margin-top:5px}
.studio-current.is-occupied .indicator{background:#ff7b80}
.studio-current .live-copy{display:grid;gap:3px;min-width:0}
.studio-current [data-live-label]{color:#b7ebd0;font-weight:800;font-size:13px}
.studio-current.is-occupied [data-live-label]{color:#ff9fa2}
.studio-current [data-live-countdown]{color:#eee5e8;font-weight:650;font-size:13px}
.studio-current [data-live-detail]{color:#97939b;font-size:11px}
@media(max-width:570px){.room-now{display:flex;flex-direction:column;min-height:150px}.room-now .room-status{font-size:22px;margin-top:8px}.room-now .room-countdown{font-size:13px;margin-top:3px}.room-now .room-detail{min-height:unset;margin-top:10px;width:100%}.room-now .room-usage{margin-top:5px}.studio-current{margin-top:12px}}

/* IKIRU 4 / Interface limpa, tema claro inicial e modo noturno */
:root{--bg:#f8f8f7;--surface:#ffffff;--surface2:#f5f5f4;--surface3:#ededeb;--edge:#e9e9e7;--text:#191919;--muted:#797a7c;--soft:#626267;--red:#ce373f;--redDim:#fcebee;--blue:#416da9;--violet:#7657b6;--green:#338761;--gold:#987439;--shadow:0 18px 60px #20202016}
html[data-theme="dark"]{--bg:#09090b;--surface:#101013;--surface2:#151519;--surface3:#1d1d22;--edge:#29292f;--text:#f3f2f0;--muted:#92929b;--soft:#b1b1ba;--red:#ef4043;--redDim:rgba(239,64,67,.12);--blue:#78a6f9;--violet:#bda0f5;--green:#8fd6b1;--gold:#e4bc78;--shadow:0 24px 90px #0009}
.room-now,.room-now.is-available,.room-now.is-occupied{background:var(--surface);border:1px solid var(--edge);border-radius:13px;min-height:147px;padding:20px;box-shadow:none;gap:0;transition:border-color .15s,transform .15s}
.room-now:hover{border-color:var(--red);transform:translateY(-1px)}
.room-now .room-top{font-size:11px;color:var(--muted);letter-spacing:.085em}
.room-now .room-status{font-size:25px;line-height:1.1;margin-top:22px;letter-spacing:-.035em;font-weight:700}
.room-now.is-available .room-status{color:var(--green)}
.room-now.is-occupied .room-status{color:var(--red)}
.room-now .room-countdown{font-size:13px;color:var(--text);font-weight:550;margin-top:7px;min-height:unset}
.room-now .room-bullet,.room-now.is-occupied .room-bullet{width:7px;height:7px;box-shadow:none;background:var(--green)}
.room-now.is-occupied .room-bullet{background:var(--red)}
.room-now .room-detail{border:0;min-height:unset;margin-top:8px;padding:0;color:var(--muted);font-size:10px}
.room-now .room-detail svg{display:none}
.studio-current,.studio-current.is-occupied{background:var(--surface2);border:1px solid var(--edge);border-radius:10px;padding:12px}
.studio-current [data-live-label]{color:var(--green)}
.studio-current.is-occupied [data-live-label]{color:var(--red)}
.studio-current [data-live-countdown]{color:var(--text)}
.studio-current [data-live-detail]{color:var(--muted)}
.studio-current .indicator{background:var(--green)}.studio-current.is-occupied .indicator{background:var(--red)}
.hero{background:var(--surface);border:1px solid var(--edge);min-height:180px;border-radius:15px}
.hero:after{color:var(--redDim)}
.hero p{color:var(--muted)}.hero-stamp{color:var(--muted)}.hero-stamp strong{color:var(--text)}
.kicker{color:var(--red)}
.nav button,.btn,.room-now,.side-tools button,.tag{transition:background .15s,border-color .15s,color .15s}
.theme-switch{min-width:40px;justify-content:center}

html[data-theme="light"] .modal-header,html[data-theme="light"] .modal-actions{background:#fff;border-color:var(--edge)}
html[data-theme="light"] .modal-overlay{background:#00000064}

html[data-theme="light"] .studio-info,html[data-theme="light"] .studio-booking small{color:var(--muted)}
html[data-theme="light"] .studio-booking{border-color:var(--edge)}
html[data-theme="light"] .info-strip{background:#fbfbfa;border-color:var(--edge);color:#76767c}

html[data-theme="dark"] .room-now,.room-now.is-available:is(html[data-theme="dark"] *),.room-now.is-occupied:is(html[data-theme="dark"] *){background:#131316;border-color:#303035}
html[data-theme="dark"] .hero{background:#141416;border-color:#303036}

html[data-theme="dark"] .studio-current,html[data-theme="dark"] .studio-current.is-occupied{background:#19191d;border-color:#333339}
@media(max-width:570px){
.room-now,.room-now.is-available,.room-now.is-occupied{display:grid;grid-template-columns:1fr auto;gap:0 12px;min-height:110px;padding:16px}
.room-now .room-top{grid-column:1;grid-row:1}
.room-now .room-status{grid-column:2;grid-row:1/3;margin:0;font-size:21px;align-self:center}
.room-now .room-countdown{grid-column:1;grid-row:2;margin:9px 0 0;font-size:12px}
.room-now .room-detail{grid-column:1/3;grid-row:3;margin-top:5px}
}
</style>

<body>
<div id="app"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar" id="topbar"></header><div id="page" class="page"></div></main></div>
<div id="modal-root"></div><div id="toast-root" aria-live="polite"></div><input id="import-file" type="file" accept="application/json,.json" style="display:none" />
<script>
'use strict';
const ICONS={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 21v-4h6v4M8 7h1M15 7h1M8 12h1M15 12h1"/>',plus:'<path d="M12 5v14M5 12h14"/>',chevronLeft:'<path d="m15 18-6-6 6-6"/>',chevronRight:'<path d="m9 18 6-6-6-6"/>',download:'<path d="M12 3v12m0 0 5-5m-5 5-5-5M4 16v4h16v-4"/>',upload:'<path d="M12 21V9m0 0-5 5m5-5 5 5M4 8V4h16v4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',check:'<path d="m4 12 5 5L20 6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',edit:'<path d="M12 20h9M16 3l5 5-12 12-5 1 1-5L16 3z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',flag:'<path d="M5 21V4m0 1q4-3 8 0t8 0v11q-4 3-8 0t-8 0"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7h.01"/>',filter:'<path d="M4 7h16M7 12h10M10 17h4"/>',spark:'<path d="m12 2 1.6 6.4L20 10l-6.4 1.6L12 18l-1.6-6.4L4 10l6.4-1.6L12 2Z"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'};
ICONS.sun='<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>';
ICONS.moon='<path d="M20.98 13.3A9 9 0 0 1 10.7 3.02 9 9 0 1 0 20.98 13.3Z"/>';
const icon=(name,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.grid}</svg>`;
const $=s=>document.querySelector(s), esc=(v)=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const pad=n=>String(n).padStart(2,'0'), key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function fromKey(v){let [y,m,d]=String(v||'').split('-').map(Number);return new Date(y,m-1,d)}
function shiftDay(v,n){let d=fromKey(v);d.setDate(d.getDate()+n);return key(d)}
function monday(v){let d=fromKey(v);d.setDate(d.getDate()-((d.getDay()+6)%7));return key(d)}
function firstOfMonth(v){let d=fromKey(v);return key(new Date(d.getFullYear(),d.getMonth(),1))}
function shiftMonth(v,n){let d=fromKey(v);return key(new Date(d.getFullYear(),d.getMonth()+n,1))}
function monthName(v){return fromKey(v).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
function niceDay(v){return fromKey(v).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})}
function dateBR(v){return v?fromKey(v).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}):'Sem data definida'}
function mins(t){let [h,m]=String(t).split(':').map(Number);return h*60+m}
function duration(e){return Math.max(0,(mins(e.end)-mins(e.start))/60)}
function uid(){return 'i'+Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function initials(n){return String(n).trim().split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase()}
const STAGES=['Não informado','Ideia','Composição','Gravação','Produção','Mixagem','Masterização','Distribuição','Lançado'];
const PRIORITIES=['Alta','Média','Baixa'];
const TYPES=['Projeto IKIRU','Reunião','Projeto pessoal','Sessão de beat','Sessão de mix e master'];
const TYPE_HINTS={'Projeto IKIRU':'Produção ligada ao catálogo e às entregas da produtora','Reunião':'Alinhamento, planejamento ou encontro de equipe','Projeto pessoal':'Trabalho particular de um artista ou produtor','Sessão de beat':'Criação de instrumental, arranjo ou produção','Sessão de mix e master':'Finalização, revisão, mixagem ou masterização'};
const STUDIO_IDS=['A','B','C'];
// Relógio e disponibilidade no fuso real da IKIRU, mesmo quando alguém abre o painel em outra região.
const STUDIO_TZ='America/Sao_Paulo';
const studioDateFormatter=new Intl.DateTimeFormat('en-GB',{timeZone:STUDIO_TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function studioClock(date=new Date()){
 const parts=Object.fromEntries(studioDateFormatter.formatToParts(date).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
 const day=`${parts.year}-${parts.month}-${parts.day}`;
 const minutes=Number(parts.hour)*60+Number(parts.minute)+Number(parts.second)/60;
 return {day,minutes,display:`${parts.hour}:${parts.minute}`};
}
function remainingTime(minutes){
 const n=Math.max(1,Math.ceil(minutes-0.000001));
 const h=Math.floor(n/60),m=n%60;
 return h?(m?`${h}h ${m}min`:`${h}h`):`${m}min`;
}
function studioAvailability(studio,clock=studioClock()){
 const es=data.events.filter(e=>e.date===clock.day&&e.studio===studio).sort((a,b)=>mins(a.start)-mins(b.start));
 const active=es.find(e=>mins(e.start)<=clock.minutes&&clock.minutes<mins(e.end));
 const upcoming=es.find(e=>mins(e.start)>clock.minutes);
 const reserved=countHours(es);
 const usage=`${es.length} ${es.length===1?'sessão':'sessões'} · ${String(Number(reserved.toFixed(1))).replace('.',',')}h reservadas hoje`;
 if(active)return {busy:true,label:'OCUPADO',countdown:`Livre às ${active.end}`,detail:active.title||active.type,usage};
 if(upcoming)return {busy:false,label:'LIVRE',countdown:`Disponível até ${upcoming.start}`,detail:`Próxima · ${eArtist(upcoming)}`,usage};
 return {busy:false,label:'LIVRE',countdown:'Disponível até 23:59',detail:'Sem próximas reservas hoje',usage};
}
function renderLiveRoom(s){
 const a=studioAvailability(s);
 return `<button type="button" class="room-now ${a.busy?'is-occupied':'is-available'}" data-action="open-studio-day" data-studio="${s}" data-live-studio="${s}"><span class="room-top"><b>ESTÚDIO ${s}</b><span class="room-bullet"></span></span><strong class="room-status" data-live-label>${esc(a.label)}</strong><small class="room-countdown" data-live-countdown>${esc(a.countdown)}</small><span class="room-detail"><span data-live-detail>${esc(a.detail)}</span>${icon('arrow',13)}</span></button>`;
}
function renderStudioLiveInline(s){
 const a=studioAvailability(s);
 return `<div class="studio-current ${a.busy?'is-occupied':'is-available'}" data-live-studio="${s}"><span class="indicator"></span><div class="live-copy"><strong data-live-label>${esc(a.label)}</strong><span data-live-countdown>${esc(a.countdown)}</span><span data-live-detail>${esc(a.detail)}</span></div></div>`;
}
function updateLiveRoomStatuses(clock=studioClock()){
 for(const element of document.querySelectorAll('[data-live-studio]')){
  const a=studioAvailability(element.dataset.liveStudio,clock);
  element.classList.toggle('is-occupied',a.busy);
  element.classList.toggle('is-available',!a.busy);
  const entries={'[data-live-label]':a.label,'[data-live-countdown]':a.countdown,'[data-live-detail]':a.detail,'[data-live-usage]':a.usage};
  for(const [selector,value] of Object.entries(entries)){
   const target=element.querySelector(selector);
   if(target&&target.textContent!==value)target.textContent=value;
  }
 }
 const stamp=document.querySelector('[data-studio-live-clock]');
 if(stamp)stamp.textContent=`São Paulo · ${clock.display}`;
}
function tickStudioClock(){
 const clock=studioClock();
 if(clock.day!==today){
  const old=today;today=clock.day;
  if(view.day===old)view.day=today;
  if(view.week===monday(old))view.week=monday(today);
  if(view.month===firstOfMonth(old))view.month=firstOfMonth(today);
  if(view.year===fromKey(old).getFullYear())view.year=fromKey(today).getFullYear();
  render();
 }else updateLiveRoomStatuses(clock);
}

const defaultArtists=[['Ryuchi','#e65b5c'],['Franco, the Sir!','#a886f5'],['Kenji','#73b1dc'],['Mvt','#8bbda7'],['Mdep','#d8af71'],['Okie','#b6be81'],['Dney','#e19c73'],['Desiiik','#c9818e'],['Jovem Jota','#7cc5b2'],['DJ Tevez','#dcb477']].map(([name,color])=>({id:uid(),name,color,target:0,priority:'Média',notes:''}));
const artId=name=>defaultArtists.find(a=>a.name===name)?.id;
const INITIAL={version:2,artists:defaultArtists,projects:[{id:uid(),name:'Torii e Hutukara',artistId:artId('Ryuchi'),collaborators:'Franco, the Sir!',kind:'Álbum',releaseDate:'2026-11-27',stage:'Não informado',priority:'Média',notes:'Projeto colaborativo. Data planejada de lançamento: 27/11/2026. Atualize o estágio real e as entregas.'}],events:[]};
const STORAGE='ikiru_calendar_v1_data';
function loadData(){try{const x=JSON.parse(localStorage.getItem(STORAGE));if(x && Array.isArray(x.events)&&Array.isArray(x.artists)&&Array.isArray(x.projects))return x}catch(e){}return structuredClone(INITIAL)}
let data=loadData();
function normalizeData(x){if(!x||!Array.isArray(x.artists)||!Array.isArray(x.projects)||!Array.isArray(x.events))return structuredClone(INITIAL);
 for(const a of defaultArtists){if(!x.artists.some(old=>old.name.trim().toLocaleLowerCase('pt-BR')===a.name.trim().toLocaleLowerCase('pt-BR')))x.artists.push({...a,id:uid()});}
 x.events=x.events.map(e=>({...e,participantIds:Array.isArray(e.participantIds)?e.participantIds:[]}));x.version=2;return x;}
data=normalizeData(data);
const now=new Date();let today=studioClock(now).day;
let view={page:'dashboard',calView:'week',week:monday(today),day:today,month:firstOfMonth(today),year:fromKey(today).getFullYear(),studio:'all',artist:'all',type:'all'};
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch(e){toast('Não foi possível salvar neste navegador. Exporte um backup.')}}
function artist(id){return data.artists.find(a=>a.id===id)}
function project(id){return data.projects.find(p=>p.id===id)}
function eArtist(e){return artist(e.artistId)?.name || 'Sem artista'}
function priorityTag(p){return `<span class="tag ${p==='Alta'?'red':p==='Média'?'gold':'green'}">${esc(p)}</span>`}
function stagePercent(s){let i=STAGES.indexOf(s);return i<=0?0:Math.round(i/(STAGES.length-1)*100)}
function eventClass(e){return e.studio==='A'?'studio-a':e.studio==='B'?'studio-b':e.studio==='C'?'studio-c':'studio-off'}
function tagStudio(e){return `<span class="tag ${e.studio==='A'?'red':e.studio==='B'?'blue':e.studio==='C'?'green':'gold'}">${e.studio==='Fora'?'Externo':'Estúdio '+esc(e.studio)}</span>`}
function rangeEvents(from,to){return data.events.filter(e=>e.date>=from && e.date<=to).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))}
function filteredEvents(from,to){return rangeEvents(from,to).filter(e=>(view.studio==='all'||e.studio===view.studio)&&(view.artist==='all'||e.artistId===view.artist||(e.participantIds||[]).includes(view.artist))&&(view.type==='all'||e.type===view.type))}
function upcomingProjects(){return [...data.projects].filter(p=>p.releaseDate && p.releaseDate>=today).sort((a,b)=>a.releaseDate.localeCompare(b.releaseDate))}
function eventsThisMonth(artistId,month=view.month){return data.events.filter(e=>(e.artistId===artistId||(e.participantIds||[]).includes(artistId))&&e.date.slice(0,7)===month.slice(0,7)).length}
function closeToLaunch(p,days=45){return p.releaseDate&&p.releaseDate>=today&&(fromKey(p.releaseDate)-fromKey(today))/86400000<=days}
function countHours(events){return events.reduce((s,e)=>s+duration(e),0)}
function toast(message){const root=$('#toast-root');root.innerHTML=`<div class="toast">${esc(message)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>root.innerHTML='',3800)}
function button(label,action,variant='ghost',extra=''){return `<button type="button" class="btn ${variant}" data-action="${action}" ${extra}>${label}</button>`}
function empty(title,sub,action='',label=''){return `<div class="empty"><strong>${esc(title)}</strong>${esc(sub)}${action?`<div>${button(`${icon('plus')} ${esc(label)}`,action,'tiny')}</div>`:''}</div>`}
const THEME_STORAGE='ikiru_theme_v4';
let theme='light';
try { theme=localStorage.getItem(THEME_STORAGE)==='dark'?'dark':'light'; }catch(e){}
function applyTheme(next){
 theme=next==='dark'?'dark':'light';
 document.documentElement.dataset.theme=theme;
 document.querySelector('meta[name="theme-color"]')?.setAttribute('content',theme==='light'?'#ffffff':'#09090b');
 try{localStorage.setItem(THEME_STORAGE,theme)}catch(e){}
 const t=document.getElementById('theme-toggle');
 if(t){t.innerHTML=icon(theme==='light'?'moon':'sun',18);t.title=theme==='light'?'Usar tema escuro':'Usar tema claro';t.setAttribute('aria-label',t.title)}
}
function toggleTheme(){applyTheme(theme==='light'?'dark':'light')}
function navHTML(){let navs=[['dashboard','grid','Início'],['calendar','calendar','Agenda'],['studios','building','Estúdios'],['projects','music','Lançamentos'],['artists','users','Artistas']];return `<div class="brand"><div class="brand-mark">生</div><div><b>IKIRU</b><small>Production system</small></div></div><div><div class="nav-label">ORGANIZAÇÃO</div><nav class="nav">${navs.map(([id,ico,name])=>`<button data-nav="${id}" class="${view.page===id?'active':''}" title="${name}">${icon(ico)}<span class="nav-text">${name}</span></button>`).join('')}</nav></div><div class="sidebar-bottom"><div class="side-label">DADOS & ACESSO</div><div class="side-pill"><b><span class="dot"></span>Salvo neste dispositivo</b>Para acesso de todos em tempo real, o painel precisará ser publicado e conectado a uma base compartilhada.</div><div class="side-tools"><button data-action="export-json">${icon('download',14)} Backup</button><button data-action="import-json">${icon('upload',14)} Restaurar</button></div><div class="side-tools"><button data-action="export-ics">${icon('calendar',14)} Exportar .ics</button><button data-action="about-sync">${icon('info',14)} Compartilhar</button></div></div>`}
function topHTML(){return `<div><div class="eyebrow">IKIRU / PRODUCTION</div><div class="workspace">Painel de produção</div></div><div class="top-actions"><div class="today-badge">${new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})}</div><button type="button" class="btn ghost icon-only theme-switch" id="theme-toggle" data-action="toggle-theme" title="Alternar tema" aria-label="Alternar tema">${icon(theme==='light'?'moon':'sun',18)}</button>${button(`${icon('plus')} Marcar sessão`,'new-event','primary')}</div>`}
function render(){ $('#sidebar').innerHTML=navHTML();$('#topbar').innerHTML=topHTML();let pages={dashboard:renderDashboard,calendar:renderCalendar,studios:renderStudios,projects:renderProjects,artists:renderArtists};$('#page').innerHTML=(pages[view.page]||renderDashboard)();let scroll=$('#week-scroll')||$('#day-scroll');if(scroll)requestAnimationFrame(()=>{scroll.scrollTop=8*48}) }
function header(title,subtitle,action=''){return `<div class="page-head"><div><div class="kicker">IKIRU / ${view.page==='dashboard'?'HOME':view.page.toUpperCase()}</div><h1>${title}</h1><p>${subtitle}</p></div>${action?`<div class="page-head-actions">${action}</div>`:''}</div>`}
function renderDashboard(){
 const w1=monday(today),w2=shiftDay(w1,6),week=rangeEvents(w1,w2),todayEvents=rangeEvents(today,today),next=upcomingProjects();
 const focus=[...data.artists].sort((a,b)=>PRIORITIES.indexOf(a.priority)-PRIORITIES.indexOf(b.priority)).slice(0,6);
  const studioToday=STUDIO_IDS.map(renderLiveRoom).join('');
 const weekTypes=TYPES.map(type=>({type,events:week.filter(e=>e.type===type)}));
 return `<div class="hero hero-new"><div class="hero-content"><div class="kicker">IKIRU / CENTRAL DE PRODUÇÃO</div><h1>Um lugar para<br>tudo acontecer.</h1><p>Agenda, estúdios e lançamentos. Toda a operação musical, com clareza.</p><div class="hero-cta">${button(`${icon('plus')} Marcar uma sessão`,'new-event','primary')} ${button(`${icon('calendar')} Ver minha semana`,'goto-calendar','ghost')}</div></div><div class="hero-stamp"><strong>生</strong><span>VIVER A VIDA</span></div></div>
 <div class="section-title"><h2>Estúdios hoje</h2><span data-studio-live-clock>São Paulo · ${studioClock().display}</span></div><div class="studio-now-grid">${studioToday}</div>
 <div class="stat-grid compact-stats">
 ${stat('Sessões na semana',String(week.length),'De '+niceDay(w1)+' a '+niceDay(w2),'calendar')}
 ${stat('Horas programadas',String(Number(countHours(week).toFixed(1))).replace('.',',')+'h','Nos três estúdios e externamente','clock')}
 ${stat('Lançamentos futuros',String(next.length),'Projetos no roadmap','music')}
 ${stat('Artistas no painel',String(data.artists.length),'Cadastro de participantes','users')}
 </div>
 <div class="split" style="margin-top:15px"><section class="panel"><div class="panel-head"><h3>Programação de hoje</h3><button class="link-button" data-action="goto-today">Ver espaços ${icon('arrow',13)}</button></div>${todayEvents.length?todayEvents.map(eventRow).join(''):empty('Agenda livre hoje','Marque uma sessão diretamente, escolhendo o estúdio e o horário.','new-event','Marcar sessão')}</section>
 <section class="panel"><div class="panel-head"><h3>Próximos lançamentos</h3><button class="link-button" data-nav="projects">Ver planejamento ${icon('arrow',13)}</button></div>${next.length?next.slice(0,5).map(projectLine).join(''):empty('Sem lançamento futuro','Cadastre as próximas datas do planejamento.','new-project','Criar lançamento')}</section></div>
 <div class="split" style="margin-top:15px"><section class="panel"><div class="panel-head"><h3>Foco dos artistas</h3><button class="link-button" data-nav="artists">Todas as metas ${icon('arrow',13)}</button></div>${focus.length?focus.map(priorityRow).join(''):empty('Ainda sem artistas','Cadastre artistas para planejar.','new-artist','Adicionar')}</section>
 <section class="panel"><div class="panel-head"><h3>Como a semana está distribuída</h3><button class="link-button" data-action="goto-calendar">Abrir agenda ${icon('arrow',13)}</button></div><div class="type-stats">${weekTypes.map(({type,events})=>`<button class="type-stat" data-action="category-filter" data-type="${esc(type)}"><span>${esc(type)}</span><strong>${events.length}</strong><div class="track"><i style="width:${week.length?events.length/week.length*100:0}%"></i></div></button>`).join('')}</div><div class="muted small" style="margin-top:14px">Selecione uma categoria para filtrar a agenda semanal. Registros antigos podem manter classificações anteriores.</div></section></div>
 <div class="info-strip">${icon('info')}<div><strong>Versão local:</strong> a agenda funciona neste navegador. Para a equipe reservar simultaneamente em vários aparelhos será necessária uma versão online com autenticação e banco de dados.</div></div>`;
}
function stat(title,value,caption,ico){return `<div class="stat-card"><div class="stat-top"><span>${title}</span><span class="stat-icon">${icon(ico)}</span></div><div class="stat-number">${value}</div><div class="stat-caption">${esc(caption)}</div></div>`}

function toolbarPeriod(name,type){return `<div class="date-nav">${button(icon('chevronLeft'),'prev-period','tiny icon-only')}<span class="period">${esc(name)}</span>${button(icon('chevronRight'),'next-period','tiny icon-only')}${button('Hoje','today-period','tiny')}</div>`}
function renderCalendar(){let period=view.calView==='week'?`${niceDay(view.week)} — ${niceDay(shiftDay(view.week,6))}`:view.calView==='day'?dateBR(view.day):view.calView==='month'?monthName(view.month):String(view.year);

function renderWeek(){let days=Array.from({length:7},(_,i)=>shiftDay(view.week,i)),weekday=['DOM','SEG','TER','QUA','QUI','SEX','SÁ'];return `<div class="calendar-shell"><div class="week-scroll" id="week-scroll"><div class="week-grid"><div class="cal-corner"></div>${days.map(d=>`<div class="cal-day-head ${d===today?'today':''}"><b>${weekday[fromKey(d).getDay()]}</b><strong>${fromKey(d).getDate()}</strong></div>`).join('')}<div class="time-axis">${timeMarks()}</div>${days.map(d=>`<div class="cal-day-column" data-action="slot" data-date="${d}">${positionEvents(filteredEvents(d,d),true)}</div>`).join('')}</div></div></div>`}
function timeMarks(){return Array.from({length:24},(_,h)=>`<span class="time-mark" style="--y:${h*48}px">${pad(h)}:00</span>`).join('')}
function positionEvents(events,split=false){const evs=[...events].sort((a,b)=>mins(a.start)-mins(b.start));let groups=[],seen=new Set();for(let e of evs){if(seen.has(e.id))continue;let group=[e],changed=true;seen.add(e.id);while(changed){changed=false;for(let x of evs){if(seen.has(x.id))continue;if(group.some(g=>mins(x.start)<mins(g.end)&&mins(x.end)>mins(g.start))){group.push(x);seen.add(x.id);changed=true}}}groups.push(group)}
return groups.map(group=>group.map((e,i)=>{let start=mins(e.start),end=mins(e.end),top=start/60*48,height=Math.max(22,(end-start)/60*48-2),n=split?group.length:1,style=split?`left:calc(${100*i/n}% + 2px);right:calc(${100*(n-i-1)/n}% + 2px);`:'';return `<button type="button" title="${esc(`${e.start}–${e.end} · Estúdio ${e.studio} · ${e.title||e.type}`)}" class="week-event ${eventClass(e)}" data-action="view-event" data-id="${esc(e.id)}" style="${style}top:${top}px;height:${height}px"><small>${esc(e.start)} · ${esc(e.studio==='Fora'?'EXT':e.studio)}</small><strong>${esc(e.title||e.type)}</strong>${height>48?`<span class="event-sub">${esc(eArtist(e))}</span>`:''}</button>`}).join('')).join('')}
function renderDay(){let events=filteredEvents(view.day,view.day),outside=events.filter(e=>e.studio==='Fora');return `<div class="calendar-shell"><div class="day-scroll" id="day-scroll"><div class="day-grid"><div class="day-col-head"></div>${STUDIO_IDS.map(s=>`<div class="day-col-head">${icon('building')} Estúdio ${s}</div>`).join('')}<div class="time-axis">${timeMarks()}</div>${STUDIO_IDS.map(s=>`<div class="day-col" data-action="slot" data-date="${view.day}" data-studio="${s}">${positionEvents(events.filter(e=>e.studio===s))}</div>`).join('')}</div></div></div>${outside.length?`<div class="section-title"><h2>Compromissos externos</h2></div><section class="panel">${outside.map(eventRow).join('')}</section>`:''}`}
function renderMonth(){let d=fromKey(view.month),first=new Date(d.getFullYear(),d.getMonth(),1),last=new Date(d.getFullYear(),d.getMonth()+1,0),offset=(first.getDay()+6)%7,count=Math.ceil((offset+last.getDate())/7)*7;let weekdays=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];return `<div class="calendar-shell"><div class="month-grid">${weekdays.map(w=>`<div class="month-dow">${w}</div>`).join('')}${Array.from({length:count},(_,i)=>{let dt=new Date(d.getFullYear(),d.getMonth(),i-offset+1),k=key(dt),ev=filteredEvents(k,k),pr=data.projects.filter(p=>p.releaseDate===k),items=[...ev.map(e=>({label:e.start+' '+(e.title||e.type),kind:e.studio==='B'?'b':e.studio==='A'?'a':e.studio==='C'?'c':'off',id:e.id,action:'view-event'})),...pr.map(p=>({label:'★ '+p.name,kind:'launch',id:p.id,action:'edit-project'}))];return `<div class="month-cell ${dt.getMonth()!==d.getMonth()?'other':''} ${k===today?'today':''}" data-action="month-day" data-date="${k}"><div class="month-number">${dt.getDate()}</div>${items.slice(0,3).map(e=>`<button class="month-chip ${e.kind}" data-action="${e.action}" data-id="${esc(e.id)}" title="${esc(e.label)}">${esc(e.label)}</button>`).join('')}${items.length>3?`<div class="month-plus">+${items.length-3} mais</div>`:''}</div>`}).join('')}</div></div>`}
function miniCal(y,m){let first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let monthKey=`${y}-${pad(m+1)}`,marked=new Set([...data.events.filter(e=>e.date.startsWith(monthKey)).map(e=>Number(e.date.slice(8))),...data.projects.filter(p=>p.releaseDate?.startsWith(monthKey)).map(p=>Number(p.releaseDate.slice(8)))]);return `<div class="mini-month">${Array.from({length:start},()=>'<span></span>').join('')}${Array.from({length:days},(_,i)=>{let k=`${monthKey}-${pad(i+1)}`;return `<span class="this ${marked.has(i+1)?'marked':''} ${k===today?'current':''}">${i+1}</span>`}).join('')}</div>`}
function renderYear(){return `<div class="year-tiles">${Array.from({length:12},(_,m)=>{let month=`${view.year}-${pad(m+1)}`,projs=data.projects.filter(p=>p.releaseDate?.startsWith(month)),n=data.events.filter(e=>e.date.startsWith(month)).length;return `<button type="button" class="year-tile" data-action="open-month" data-month="${month}-01"><div class="year-month">${new Date(view.year,m,1).toLocaleDateString('pt-BR',{month:'long'})}<small>${n} sess.</small></div>${miniCal(view.year,m)}<div class="month-release-note">${projs.length?`${projs.length} lançamento(s): ${projs.map(p=>p.name).join(', ')}`:'Sem lançamentos cadastrados'}</div></button>`}).join('')}</div><div class="section-title"><h2>Lançamentos de ${view.year}</h2><button class="link-button" data-nav="projects">Roadmap completo ${icon('arrow',13)}</button></div>${renderRoadmap(data.projects.filter(p=>p.releaseDate?.startsWith(String(view.year))))}`}

function projectModal(id=null){let old=data.projects.find(p=>p.id===id);let p=old||{name:'',artistId:'',collaborators:'',kind:'Single',releaseDate:'',stage:'Ideia',priority:'Média',notes:''};let body=`<form id="project-form" data-id="${esc(id||'')}"><div class="field-grid">${inputField('name','Nome do projeto','text',p.name,'required placeholder="Nome do single, EP ou álbum"',true)}${selectField('kind','Formato',['Single','EP','Álbum','Mixtape','Outro'].map(x=>[x,x]),p.kind)}${selectField('artistId','Artista principal',[['','Selecione o artista'],...data.artists.map(a=>[a.id,a.name])],p.artistId)}${inputField('collaborators','Participações / outros artistas','text',p.collaborators,'placeholder="Ex.: Franco, the Sir!"',true)}${inputField('releaseDate','Data do lançamento','date',p.releaseDate)}${selectField('stage','Etapa atual',STAGES.map(x=>[x,x]),p.stage)}${selectField('priority','Prioridade',PRIORITIES.map(x=>[x,x]),p.priority)}${textField('notes','Descrição / entregas',p.notes)}</div><div class="form-error" id="form-error"></div><div class="modal-actions">${old?button(`${icon('trash')} Excluir projeto`,'delete-project','danger',`data-id="${esc(id)}"`):'<span></span>'}<div class="right">${button('Cancelar','close-modal','ghost')}<button class="btn primary" type="submit">${icon('check')} Salvar projeto</button></div></div></form>`;modalBase(old?'Editar projeto':'Novo lançamento / projeto',body)}
function artistModal(id=null){let old=data.artists.find(a=>a.id===id);let a=old||{name:'',target:0,priority:'Média',color:'#ef4043',notes:''};let body=`<form id="artist-form" data-id="${esc(id||'')}"><div class="field-grid">${inputField('name','Nome artístico','text',a.name,'required placeholder="Nome do artista"',true)}${inputField('target','Meta de sessões por mês','number',a.target,'min="0" max="100" step="1"')}${selectField('priority','Prioridade',PRIORITIES.map(x=>[x,x]),a.priority)}${inputField('color','Cor no painel','color',a.color)}${textField('notes','Observações de planejamento',a.notes)}</div><div class="form-error" id="form-error"></div><div class="modal-actions">${old?button(`${icon('trash')} Excluir artista`,'delete-artist','danger',`data-id="${esc(id)}"`):'<span></span>'}<div class="right">${button('Cancelar','close-modal','ghost')}<button class="btn primary" type="submit">${icon('check')} Salvar artista</button></div></div></form>`;modalBase(old?'Editar artista':'Adicionar artista',body)}
function viewEvent(id){let e=data.events.find(e=>e.id===id);if(!e)return;let p=project(e.projectId);let body=`<div class="kicker">${esc(e.type)} · ${esc(e.date)}</div><div class="detail-big" style="margin:8px 0 16px">${esc(e.title)}</div><div class="detail-grid"><div class="detail-block"><small>Data</small><strong>${dateBR(e.date)}</strong></div><div class="detail-block"><small>Horário</small><strong>${esc(e.start)}–${esc(e.end)}</strong></div><div class="detail-block"><small>Espaço</small>${tagStudio(e)}</div><div class="detail-block"><small>Artista</small><strong>${esc(eArtist(e))}</strong></div><div class="detail-block"><small>Projeto</small><strong>${esc(p?.name||'Não relacionado')}</strong></div><div class="detail-block"><small>Responsável</small><strong>${esc(e.responsible||'Não definido')}</strong></div><div class="detail-block"><small>Participantes adicionais</small><strong>${esc((e.participantIds||[]).map(x=>artist(x)?.name).filter(Boolean).join(', ')||'Não informados')}</strong></div></div>${e.notes?`<div class="detail-block"><small>Observações</small>${esc(e.notes).replace(/\n/g,'<br>')}</div>`:''}<div class="modal-actions"><div></div><div class="right">${button('Fechar','close-modal','ghost')}${button(`${icon('edit')} Editar`,'edit-event','primary',`data-id="${esc(e.id)}"`)}</div></div>`;modalBase('Detalhes da sessão',body)}
function syncInfo(){modalBase('Compartilhamento e sincronização',`<p class="small muted" style="margin-top:0">Este arquivo é uma versão local do painel. As reservas ficam salvas no navegador do dispositivo utilizado.</p><div class="detail-block"><small>Já funciona</small><strong>Reservas, avisos de conflito, artistas, projetos, visões de calendário, backup JSON e exportação ICS.</strong></div><div class="detail-block"><small>Para a equipe editar ao mesmo tempo</small><strong>Precisamos conectar a um banco de dados compartilhado (por exemplo, Supabase) e publicar o painel em uma URL. Também será necessário configurar usuários e permissões.</strong></div><div class="detail-block"><small>Google Agenda</small><strong>O arquivo .ics pode ser importado para o Google Agenda, mas não cria sincronização contínua. O vínculo automático exige uma integração com autenticação própria.</strong></div><div class="modal-actions"><span></span><div class="right">${button('Fechar','close-modal','ghost')}${button(`${icon('download')} Exportar .ics`,'export-ics','primary')}</div></div>`)}
function formError(s){let el=$('#form-error');if(el){el.textContent=s;el.classList.add('visible')}}
function eventSubmit(form){let fd=new FormData(form),v=Object.fromEntries(fd.entries()),id=form.dataset.id;v.participantIds=[...new Set(fd.getAll('participantIds'))].filter(id=>data.artists.some(a=>a.id===id));if(!v.title.trim()){v.title=`${v.type}${v.artistId?' · '+(artist(v.artistId)?.name||'IKIRU'):''}`;}if(mins(v.end)<=mins(v.start))return formError('O horário final precisa ser depois do início, no mesmo dia.');let validDate=/^\d{4}-\d{2}-\d{2}$/.test(v.date)&&key(fromKey(v.date))===v.date;if(!validDate)return formError('Escolha uma data válida.');if(![...STUDIO_IDS,'Fora'].includes(v.studio))return formError('Escolha um estúdio ou externo.');if(!TYPES.includes(v.type))return formError('Escolha um dos cinco tipos de sessão.');let overlaps=data.events.find(e=>e.id!==id&&e.date===v.date&&e.studio===v.studio&&v.studio!=='Fora'&&mins(v.start)<mins(e.end)&&mins(v.end)>mins(e.start));if(overlaps)return formError(`Horário ocupado: Estúdio ${v.studio} já reservado ${overlaps.start}–${overlaps.end} (${overlaps.title}).`);let obj={...v,id:id||uid()};if(id){let i=data.events.findIndex(e=>e.id===id);if(i!==-1)data.events[i]=obj;}else data.events.push(obj);persist();closeModal();render();toast(id?'Sessão atualizada.':'Sessão marcada com sucesso.')}
function projectSubmit(form){let v=Object.fromEntries(new FormData(form).entries()),id=form.dataset.id;if(!v.name.trim())return formError('Informe o nome do projeto.');if(v.releaseDate&&key(fromKey(v.releaseDate))!==v.releaseDate)return formError('Data de lançamento inválida.');if(!STAGES.includes(v.stage))return formError('Etapa inválida.');let obj={...v,id:id||uid()};if(id){let i=data.projects.findIndex(p=>p.id===id);if(i>=0)data.projects[i]=obj}else data.projects.push(obj);persist();closeModal();render();toast(id?'Projeto atualizado.':'Projeto criado.');}
function artistSubmit(form){let v=Object.fromEntries(new FormData(form).entries()),id=form.dataset.id;v.target=Math.max(0,Math.min(100,parseInt(v.target,10)||0));if(!v.name.trim())return formError('Informe o nome do artista.');if(!/^#[\da-f]{6}$/i.test(v.color))v.color='#ef4043';let obj={...v,id:id||uid()};if(id){let i=data.artists.findIndex(a=>a.id===id);if(i>=0)data.artists[i]=obj}else data.artists.push(obj);persist();closeModal();render();toast(id?'Artista atualizado.':'Artista adicionado.');}
function download(content,name,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJSON(){download(JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2),`IKIRU_BACKUP_${key(new Date())}.json`,'application/json');toast('Backup exportado.')}
function icsEscape(s){return String(s??'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function icsTime(d,t){return d.replaceAll('-','')+'T'+t.replace(':','')+'00'}
function exportICS(){let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//IKIRU//Production Calendar//PT-BR','CALSCALE:GREGORIAN','X-WR-CALNAME:IKIRU Produção'];for(const e of data.events){lines.push('BEGIN:VEVENT',`UID:${e.id}@ikiru.calendar`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}`,`DTSTART;TZID=America/Sao_Paulo:${icsTime(e.date,e.start)}`,`DTEND;TZID=America/Sao_Paulo:${icsTime(e.date,e.end)}`,`SUMMARY:${icsEscape(e.title)}`,`LOCATION:${icsEscape(e.studio==='Fora'?'Externo':'IKIRU - Estúdio '+e.studio)}`,`DESCRIPTION:${icsEscape([e.type,eArtist(e),e.responsible&&'Responsável: '+e.responsible,project(e.projectId)?.name&&'Projeto: '+project(e.projectId)?.name,e.notes].filter(Boolean).join('\n'))}`,'END:VEVENT')}for(const p of data.projects.filter(p=>p.releaseDate)){let t=shiftDay(p.releaseDate,1);lines.push('BEGIN:VEVENT',`UID:${p.id}@ikiru.release`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}`,`DTSTART;VALUE=DATE:${p.releaseDate.replaceAll('-','')}`,`DTEND;VALUE=DATE:${t.replaceAll('-','')}`,`SUMMARY:${icsEscape('LANÇAMENTO · '+p.name)}`,`DESCRIPTION:${icsEscape([p.kind,artist(p.artistId)?.name,p.notes].filter(Boolean).join('\n'))}`,'END:VEVENT')}lines.push('END:VCALENDAR');download(lines.join('\r\n'),'IKIRU_CALENDARIO.ics','text/calendar;charset=utf-8');toast('Arquivo .ics exportado. A importação não mantém sincronização.')}
function handleAction(el,ev){let action=el.dataset.action,id=el.dataset.id;switch(action){case 'toggle-theme':toggleTheme();break;case 'new-event':eventModal();break;case 'new-studio-event':eventModal(null,{studio:el.dataset.studio,date:view.day});break;case 'view-event':viewEvent(id);break;case 'edit-event':eventModal(id);break;case 'new-project':projectModal();break;case 'edit-project':projectModal(id);break;case 'new-artist':artistModal();break;case 'edit-artist':artistModal(id);break;case 'close-modal':closeModal();break;case 'delete-event':if(confirm('Excluir esta sessão?')){data.events=data.events.filter(e=>e.id!==id);persist();closeModal();render();toast('Sessão excluída.')}break;case 'delete-project':if(confirm('Excluir este projeto? As sessões vinculadas permanecerão cadastradas.')){data.projects=data.projects.filter(e=>e.id!==id);data.events.forEach(e=>{if(e.projectId===id)e.projectId=''});persist();closeModal();render();toast('Projeto excluído.')}break;case 'delete-artist':if(confirm('Excluir este artista? Sessões e projetos vinculados ficarão sem artista.')){data.artists=data.artists.filter(e=>e.id!==id);data.events.forEach(e=>{if(e.artistId===id)e.artistId='';e.participantIds=(e.participantIds||[]).filter(x=>x!==id)});data.projects.forEach(p=>{if(p.artistId===id)p.artistId=''});persist();closeModal();render();toast('Artista excluído.')}break;case 'open-studio-day':view.page='calendar';view.calView='day';view.day=today;view.studio=el.dataset.studio||'all';render();break;case 'category-filter':view.page='calendar';view.calView='week';view.week=monday(today);view.type=el.dataset.type||'all';render();break;case 'goto-calendar':view.page='calendar';view.calView='week';view.studio='all';render();break;case 'goto-today':view.page='studios';view.day=today;render();break;case 'open-day-agenda':view.page='calendar';view.calView='day';render();break;case 'prev-day':view.day=shiftDay(view.day,-1);render();break;case 'next-day':view.day=shiftDay(view.day,1);render();break;case 'reset-day':view.day=today;render();break;case 'prev-year':view.year--;render();break;case 'next-year':view.year++;render();break;case 'prev-period':movePeriod(-1);break;case 'next-period':movePeriod(1);break;case 'today-period':view.day=today;view.week=monday(today);view.month=firstOfMonth(today);view.year=fromKey(today).getFullYear();render();break;case 'slot':if(ev.target.closest('.week-event'))return;{let rect=el.getBoundingClientRect(),y=ev.clientY-rect.top;let hour=Math.floor(Math.max(0,Math.min(23,y/48)));eventModal(null,{date:el.dataset.date,start:`${pad(hour)}:00`,end:`${pad(Math.min(23,hour+2))}:${hour>=22?'59':'00'}`,studio:el.dataset.studio||'A'});}break;case 'month-day':if(ev.target.closest('.month-chip'))return;view.day=el.dataset.date;view.calView='day';render();break;case 'open-month':view.page='calendar';view.calView='month';view.month=el.dataset.month;render();break;case 'export-json':exportJSON();break;case 'import-json':$('#import-file').click();break;case 'export-ics':exportICS();break;case 'about-sync':syncInfo();break;}}
function movePeriod(n){if(view.calView==='day')view.day=shiftDay(view.day,n);else if(view.calView==='week')view.week=shiftDay(view.week,7*n);else if(view.calView==='month')view.month=shiftMonth(view.month,n);else view.year+=n;render()}
document.addEventListener('click',ev=>{let nav=ev.target.closest('[data-nav]');if(nav){view.page=nav.dataset.nav;render();return}let v=ev.target.closest('[data-view]');if(v){view.calView=v.dataset.view;render();return}let action=ev.target.closest('[data-action]');if(action)handleAction(action,ev);else if(ev.target.id==='modal-overlay')closeModal()});
document.addEventListener('submit',ev=>{if(['event-form','artist-form','project-form'].includes(ev.target.id)){ev.preventDefault();if(ev.target.id==='event-form')eventSubmit(ev.target);if(ev.target.id==='project-form')projectSubmit(ev.target);if(ev.target.id==='artist-form')artistSubmit(ev.target)}});
document.addEventListener('change',ev=>{if(ev.target.id==='filter-studio')view.studio=ev.target.value;else if(ev.target.id==='filter-artist')view.artist=ev.target.value;else if(ev.target.id==='filter-type')view.type=ev.target.value;else return;render()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});
$('#import-file').addEventListener('change',async ev=>{let f=ev.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x||!Array.isArray(x.artists)||!Array.isArray(x.projects)||!Array.isArray(x.events))throw Error('Formato inválido');if(!confirm(`Substituir os dados locais por este backup?\n${x.artists.length} artistas, ${x.projects.length} projetos, ${x.events.length} sessões.\nSalve antes um backup dos dados atuais, se necessário.`))return;data=normalizeData(x);persist();render();toast('Backup restaurado e artistas atualizados.')}catch(err){alert('Não foi possível importar: '+err.message)}finally{ev.target.value=''}});
try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch(e){}
render();
setInterval(tickStudioClock,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tickStudioClock()});
</script>
</body>
</html>
