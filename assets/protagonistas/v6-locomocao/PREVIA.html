<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corrida V6 — comparação com V5</title>
<style>body{margin:0;background:#18191e;color:#eee;font:14px system-ui}header{position:sticky;top:0;z-index:2;background:#24252c;padding:14px;border-bottom:1px solid #555}h1{font-size:20px;margin:0 0 8px}label,button{margin-right:16px}button{padding:7px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;padding:12px}.card{padding:12px;background:#282a32;border:1px solid #444;border-radius:6px}.pair{display:flex;gap:10px}.pane{text-align:center}.pane p{margin:6px 0}.frame{width:128px;height:128px;image-rendering:pixelated;background-color:#3e424e;background-image:linear-gradient(45deg,#343844 25%,transparent 25%),linear-gradient(-45deg,#343844 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#343844 75%),linear-gradient(-45deg,transparent 75%,#343844 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}.note{color:#bbb;font-size:12px}.new{color:#ffd872}output{font-variant-numeric:tabular-nums}</style>
<header><h1>Corrida V6 — oito originais + quatro poses autoradas</h1><label><input id="play" type="checkbox" checked> reproduzir</label><label>velocidade <input id="speed" type="range" min="0.15" max="1.5" step="0.05" value="1"></label><button id="next">Próximo quadro V6</button><label><input id="anchor" type="checkbox"> mostrar pivô</label><output id="status"></output><p class="note">Ciclo preservado em 520 ms. Amarelo identifica os quadros novos. Esta prévia é de assets, não uma execução do jogo.</p></header><main class="grid" id="grid"></main>
<script>
const timings=[32.5,32.5,65,32.5,32.5,65,32.5,32.5,65,32.5,32.5,65],starts=[0];for(const n of timings)starts.push(starts.at(-1)+n);
const items=[],images={};for(const hero of ['franco','ryuchi']){images[hero]={};for(const version of ['v5','v6']){const image=new Image();image.src=version==='v5'?'../v5/atlas/'+hero+'_run.png':'atlas/'+hero+'_run.png';images[hero][version]=image;}for(let row=0;row<8;row++){const card=document.createElement('section');card.className='card';card.innerHTML='<b>'+hero+' · '+(row<4?'sem máscara':'com máscara')+' · '+['down','left','up','right'][row%4]+'</b><div class="pair"><div class="pane"><p>V5 · 8 poses</p><canvas class="frame" width="256" height="256"></canvas></div><div class="pane"><p>V6 · 12 poses</p><canvas class="frame" width="256" height="256"></canvas></div></div><p class="note phase"></p>';document.querySelector('#grid').append(card);items.push({hero,row,contexts:[...card.querySelectorAll('canvas')].map(c=>c.getContext('2d')),phase:card.querySelector('.phase')});}}
let elapsed=0,last=performance.now();const play=document.querySelector('#play'),speed=document.querySelector('#speed'),anchor=document.querySelector('#anchor');
document.querySelector('#next').onclick=()=>{play.checked=false;const t=elapsed%520;let i=timings.findIndex((n,k)=>t<starts[k+1]);elapsed=starts[(i+1)%12];};
function draw(now){if(play.checked)elapsed+=(now-last)*Number(speed.value);last=now;const t=elapsed%520,oldFrame=Math.floor(t/65),frame=timings.findIndex((n,k)=>t<starts[k+1]),isNew=[1,4,7,10].includes(frame);document.querySelector('#status').textContent='V6 '+frame+'/11 · '+Math.round(t)+' ms';for(const item of items){for(let i=0;i<2;i++){const q=item.contexts[i],image=images[item.hero][i===0?'v5':'v6'];q.clearRect(0,0,256,256);q.imageSmoothingEnabled=false;if(image.complete&&image.naturalWidth)q.drawImage(image,(i===0?oldFrame:frame)*256,item.row*256,256,256,0,0,256,256);if(anchor.checked){q.strokeStyle='#72de97';q.beginPath();q.moveTo(0,224.5);q.lineTo(256,224.5);q.moveTo(128.5,214);q.lineTo(128.5,234);q.stroke();}}item.phase.className='note phase'+(isNew?' new':'');item.phase.textContent='V5 '+oldFrame+' · V6 '+frame+(isNew?' · pose nova':' · original preservado');}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
