<!doctype html><meta charset="utf-8"><title>V7 · Locomoção</title><style>body{background:#282432;color:#eee;font:16px monospace}canvas{image-rendering:pixelated;border:1px solid #a88}select,button{font:inherit;margin:10px}</style><h1>V7 · 16 desenhos por ciclo</h1><p>Prévia de atlas. Não comprova gameplay nem desempenho mobile.</p><select id="dir"><option>down<option>left<option>up<option>right</select><label><input id="mask" type="checkbox">Máscara</label><canvas width="920" height="260"></canvas><script>const cv=document.querySelector('canvas'),ctx=cv.getContext('2d'),rows=['down','left','up','right'],clips=['franco_walk','franco_run','ryuchi_walk','ryuchi_run'],images=clips.map(k=>{const im=new Image();im.src='atlas/'+k+'.png';return im});function draw(t){ctx.fillStyle='#3c3540';ctx.fillRect(0,0,cv.width,cv.height);const row=rows.indexOf(dir.value)+(mask.checked?4:0);ctx.imageSmoothingEnabled=false;clips.forEach((key,i)=>{const cycle=key.endsWith('run')?520:600.6006006,frame=Math.floor((t%cycle)/cycle*16),im=images[i];if(im.complete)ctx.drawImage(im,frame*256,row*256,256,256,i*230+27,15,176,176);ctx.fillStyle='#fff';ctx.fillText(key+' · '+frame,i*230+20,220)});requestAnimationFrame(draw)}requestAnimationFrame(draw)</script>
