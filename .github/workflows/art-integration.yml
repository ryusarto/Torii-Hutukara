name: Art integration QA
on:
  pull_request:
    branches: [main]
concurrency:
  group: art-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimizer dependencies
        run: python3 -m pip install --disable-pip-version-check pillow==12.3.0 numpy==2.5.3
      - name: Reuse converted images
        uses: actions/cache@v4
        with:
          path: production/.media-cache
          key: media-webp-${{ hashFiles('production/otimizar_media.py') }}-${{ github.sha }}
          restore-keys: media-webp-${{ hashFiles('production/otimizar_media.py') }}-
      - name: Generate, validate and export
        run: |
          ruby game/source/chapter-03/build_alpha.rb
          ruby game/source/chapter-03/validate_alpha.rb
          ruby production/build_playtest.rb
      - name: Test protagonist art, variants, input and coop
        run: |
          node qa/protagonist_state.cjs
          node qa/musician_art_unit.cjs
          node qa/musician_presentation_unit.cjs
          node qa/run_art_integration.cjs
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-integration-qa
          path: |
            qa/beta-*/
            qa/release-*/
