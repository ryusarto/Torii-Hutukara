name: Art integration QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/protagonistas-v5]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate, validate and export
        run: |
          ruby game/source/chapter-03/build_alpha.rb
          ruby game/source/chapter-03/validate_alpha.rb
          ruby production/build_playtest.rb
      - name: Test protagonist art, variants, input and coop
        run: node qa/run_art_integration.cjs
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protagonist-v5-qa
          path: qa/beta-1.2.0/
