name: Publish playtest

on:
  push:
    branches: [main]
    paths:
      - 'web/playtest/**'
      - 'production/build_playtest.rb'
      - 'game/builds/**'
      - '.github/workflows/playtest.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Export verified playable build
        run: ruby production/build_playtest.rb
      - uses: actions/upload-pages-artifact@v4
        with:
          path: production/playtest-dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
