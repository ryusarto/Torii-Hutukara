name: Publish playtest

on:
  push:
    branches: [main]
    paths:
      - 'web/playtest/**'
      - 'web/album/**'
      - 'production/build_playtest.rb'
      - 'production/otimizar_media.py'
      - 'production/wait_pages_artifact.py'
      - 'qa/postgame/test_pages_artifact.py'
      - 'game/source/**'
      - 'game/VERSION.json'
      - 'assets/boss-ground-fx/v1/**'
      - 'assets/cloud-world/v1/**'
      - 'assets/environment-volume/v1/**'
      - 'assets/variantes/ninja-arqueiro-v1/**'
      - 'assets/variantes/percussao-sintetizador-v1/**'
      - 'assets/cenarios/**'
      - 'assets/protagonistas/**'
      - 'assets/hero-attack-fx/**'
      - 'assets/hero-body/v1/**'
      - 'assets/studio/**'
      - 'assets/dialogue/**'
      - 'assets/npcs/vida-v1/**'
      - 'assets/npcs/vida-v2/**'
      - 'assets/boss-animations/v3/**'
      - 'assets/boss-ground-fx/v2/**'
      - 'assets/prebeta/originals/dialogue/**'
      - 'assets/chapter-03/audio/**'
      - 'assets/chapter-03/runtime/**'
      - 'assets/prebeta/runtime/**'
      - 'design/chapter-03/**'
      - 'design/dialogo/**'
      - 'qa/*.cjs'
      - '.github/workflows/playtest.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify Pages artifact selection
        run: python3 -m unittest discover -s qa/postgame -p test_pages_artifact.py
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The playable HTML is generated here from game/source and assets; it is
      # no longer stored in git. The generator is deterministic: the same
      # sources always produce the same SHA-256.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimizer dependencies
        run: python3 -m pip install --disable-pip-version-check pillow==12.3.0 numpy==2.5.3
      - name: Reuse converted images
        uses: actions/cache@v4
        with:
          path: production/.media-cache
          key: media-webp-${{ hashFiles('production/otimizar_media.py') }}-${{ github.sha }}
          restore-keys: media-webp-${{ hashFiles('production/otimizar_media.py') }}-
      - name: Generate portable build
        run: ruby game/source/chapter-03/build_alpha.rb
      - name: Validate build (fails the deploy on any error)
        run: ruby game/source/chapter-03/validate_alpha.rb
      - name: Install browser for gameplay checks
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check controls, progression, saves and coop before publishing
        run: |
          node qa/npc_recurrence.cjs
          node qa/protagonist_state.cjs
          node qa/locomotion_v6.cjs
          node qa/npc_life_v1.cjs
          node qa/boss_choreography_unit.cjs
          node qa/boss_ground_fx_unit.cjs
          node qa/environment_depth_v1.cjs
          node qa/environment_atmosphere_v1.cjs
          node qa/cloud_world_v1.cjs
          node qa/musician_art_unit.cjs
          node qa/musician_presentation_unit.cjs
          node qa/input_regression.cjs
          node qa/gameplay_regression.cjs
          node qa/postgame_unit.cjs
          node qa/dungeon_balance_unit.cjs
          node qa/review110_postgame_regression.cjs
          node qa/review110_cloud_regression.cjs
          node qa/review110_mobile_regression.cjs
          node qa/review111_postgame_unit.cjs
          node qa/review111_world.cjs
          node qa/review111_npc.cjs
          node qa/review111_animation.cjs
          node qa/review111_spacing.cjs
          node qa/sorte_reproducao.cjs
          node qa/narrativa_fase4.cjs
      - name: Keep portable HTML as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: torii-hutukara-html-portatil
          path: game/builds/
          retention-days: 90
      - name: Export verified playable build
        run: ruby production/build_playtest.rb
      - name: Check exported site before publishing
        run: |
          python3 -m http.server 8771 --bind 127.0.0.1 --directory production/playtest-dist &
          test_server_pid=$!
          trap 'kill "$test_server_pid"' EXIT
          node qa/musician_frame_hitches.cjs http://127.0.0.1:8771/
          node qa/musician_fluency.cjs http://127.0.0.1:8771/
          node qa/cenarios_deserto_v1.cjs http://127.0.0.1:8771/
          node qa/cenarios_deserto_states.cjs http://127.0.0.1:8771/
          node qa/musician_art.cjs http://127.0.0.1:8771/
          node qa/hero_attack_body_browser.cjs http://127.0.0.1:8771/
          node qa/run_stride_browser.cjs http://127.0.0.1:8771/
          node qa/archer_strafe_browser.cjs http://127.0.0.1:8771/
          node qa/hero_attack_fx_browser.cjs http://127.0.0.1:8771/
          node qa/hero_attack_v2_browser.cjs http://127.0.0.1:8771/
          node qa/hero_vfx_layers_browser.cjs http://127.0.0.1:8771/
          node qa/enemy_attack_fx_browser.cjs http://127.0.0.1:8771/
          node qa/boss_choreography_browser.cjs http://127.0.0.1:8771/
          node qa/boss_ground_fx_browser.cjs http://127.0.0.1:8771/
          node qa/environment_world_browser.cjs http://127.0.0.1:8771/
          node qa/protagonist_art_v5.cjs http://127.0.0.1:8771/
          node qa/world_polish_v1.cjs http://127.0.0.1:8771/
          node qa/npc_life_browser.cjs http://127.0.0.1:8771/
          node qa/locomotion_browser_v6.cjs http://127.0.0.1:8771/
          node qa/ninja_archer_art.cjs http://127.0.0.1:8771/
          node qa/postgame_browser.cjs http://127.0.0.1:8771/
          node qa/dungeon_playtest.cjs http://127.0.0.1:8771/
          node qa/review110_browser.cjs http://127.0.0.1:8771/
          node qa/review111_postgame_browser.cjs http://127.0.0.1:8771/
          node qa/review111_world_browser.cjs http://127.0.0.1:8771/
          node qa/playtest_site.cjs http://127.0.0.1:8771/
          node qa/carregamento_site.cjs http://127.0.0.1:8771/
      - uses: actions/upload-pages-artifact@v4
        id: pages_upload
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: production/playtest-dist
      - name: Wait for the exact uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact_id }}
        run: python3 production/wait_pages_artifact.py
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
